<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ciudadela de Valdoria — Tráiler</title>
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    { "imports": { "three": "/vendor/three.module.js" } }
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #salida { position: absolute; inset: 0; margin: auto; max-width: 100vw; max-height: 100vh; aspect-ratio: 16 / 9; width: 100%; image-rendering: pixelated; }
    #controles { position: absolute; left: 12px; top: 12px; display: flex; gap: 8px; align-items: center; z-index: 2;
      font: 14px "Pixelify Sans", monospace; color: #f2dc9a; }
    #controles button { font: inherit; background: #2a1c14; color: #f2dc9a; border: 1px solid #c9a55c; padding: 6px 12px; cursor: pointer; }
    #controles.grabando button { display: none; }
    #estado { text-shadow: 0 1px 2px #000; }
    #descargar { color: #9ad8ff; }
  </style>
</head>
<body>
  <canvas id="salida"></canvas>
  <div id="controles">
    <button id="ver">▶ Ver tráiler</button>
    <button id="grabar">⏺ Grabar vídeo</button>
    <span id="estado"></span>
    <a id="descargar" hidden>Descargar</a>
  </div>
  <script type="module" src="js/trailer.js"></script>
</body>
</html>
